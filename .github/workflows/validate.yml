name: Validate Handbook PHP and pages

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate every PHP file (PHP CLI lint)
        run: |
          set -euo pipefail
          php -v
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
      - name: Render every page in FR and EN and verify local links
        run: python3 tests/site_smoke.py
